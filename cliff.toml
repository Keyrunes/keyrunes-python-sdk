# git-cliff configuration for the Keyrunes Python SDK.
#
# This changelog used to be written by hand, and the first attempt at switching
# to generation was measured and thrown away: with the default template, which
# uses only the subject line, the file dropped from 246 lines to 61.
#
# What fixes it is including the commit **body**. The messages in this
# repository already explain the decision; they are the source. To change the
# text of an entry, reword the commit — do not edit this generated file.

[changelog]
header = """
# Changelog

All notable changes to the Keyrunes Python SDK.

Generated by `git-cliff` from the conventional commits — each commit body
becomes the text of its entry. **Do not edit by hand**: the next run overwrites
it. To change an entry, reword the commit message (`git rebase -i`); to change
the shape, edit `cliff.toml` and run `poetry run task changelog`.
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message }}
{% if commit.body %}
{{ commit.body | trim | indent(prefix="  ", first=true, blank=false) }}
{% endif %}\
{% endfor %}\
{% endfor %}\n
"""

footer = """

<!-- generated by git-cliff -->
"""

trim = true
render_always = true

postprocessors = [
    # `trim = true` strips the blank lines around each release, so a version
    # heading ends up glued to the last line of the previous one. Some Markdown
    # renderers do not read a `##` without a blank line before it as a heading.
    { pattern = '(?m)^## \[', replace = "\n## [" },
    # A commit body may carry its own Markdown headings. Indented they are still
    # headings (ATX allows up to three leading spaces) and would collide with the
    # changelog's own levels, so they become bold text.
    #
    # `[ \t]` and not `\s`: `\s` matches `\n`, and the first version reached
    # across the line break and ate the changelog's own `## [version]`, which
    # turned bold.
    { pattern = '(?m)^[ \t]{1,3}#{1,6}[ \t]+(.+)$', replace = "  **${1}**" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactored" },
    { message = "^test", group = "<!-- 4 -->Testing" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^ci|^build", group = "<!-- 6 -->Infrastructure" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "<!-- 7 -->Maintenance" },
    # Catch-all so nothing is dropped in silence: a changelog that looks complete
    # while omitting work is worse than one that is visibly untidy.
    { message = ".*", group = "<!-- 8 -->Other" },
]

commit_preprocessors = [
    # Strip the "(0.1.2)" and "; release 0.3.1" suffixes some older subjects
    # carry: the version is already the section heading.
    { pattern = '\s*[;,]?\s*\(?release\s+[0-9]+\.[0-9]+\.[0-9]+\)?\s*$', replace = "" },
    { pattern = '\s*\([0-9]+\.[0-9]+\.[0-9]+\)\s*$', replace = "" },
]
