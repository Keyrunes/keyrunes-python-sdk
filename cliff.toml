# Configuração do git-cliff para o SDK Python do Keyrunes.
#
# O changelog deste projeto era escrito à mão, e a primeira tentativa de trocar
# por geração automática **perdia** o que ele tinha de melhor: o porquê de cada
# mudança. A saída padrão do git-cliff usa só a linha de assunto do commit, e o
# arquivo caía de 246 para 61 linhas.
#
# O que resolve é incluir o **corpo** do commit. As mensagens deste repositório
# já explicam a decisão; elas é que são a fonte. Para mudar o texto de uma
# entrada, reescreva a mensagem do commit — não edite este arquivo gerado.

[changelog]
header = """
# Changelog

Todas as mudanças notáveis do SDK Python do Keyrunes.

Gerado por `git-cliff` a partir dos commits convencionais — o corpo de cada
commit vira o texto da entrada. **Não edite à mão**: a próxima geração
sobrescreve. Para mudar o texto de uma entrada, reescreva a mensagem do commit
(`git rebase -i`); para mudar a forma, edite `cliff.toml` e rode
`poetry run task changelog`.
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**quebra de compatibilidade**] {% endif %}\
{{ commit.message }}
{% if commit.body %}
{{ commit.body | trim | indent(prefix="  ", first=true, blank=false) }}
{% endif %}\
{% endfor %}\
{% endfor %}\n
"""

footer = """

<!-- gerado por git-cliff -->
"""

trim = true
render_always = true

postprocessors = [
    # `trim = true` corta o branco das pontas de cada release, então o título de
    # uma versão cola na última linha da anterior. Um `##` sem linha em branco
    # antes não é reconhecido como título por parte dos renderizadores.
    { pattern = '(?m)^## \[', replace = "\n## [" },
    # Um corpo de commit pode trazer seus próprios títulos markdown. Indentados,
    # eles continuam sendo títulos (ATX aceita até três espaços à esquerda) e
    # colidiriam com os níveis do changelog. Viram texto em negrito.
    #
    # `[ \t]` e não `\s`: `\s` casa `\n`, e com isso o padrão atravessava a quebra
    # de linha e comia o `## [versão]` do próprio changelog — que virou negrito na
    # primeira tentativa.
    { pattern = '(?m)^[ \t]{1,3}#{1,6}[ \t]+(.+)$', replace = "  **${1}**" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Adicionado" },
    { message = "^fix", group = "<!-- 1 -->Corrigido" },
    { message = "^perf", group = "<!-- 2 -->Desempenho" },
    { message = "^refactor", group = "<!-- 3 -->Refatorado" },
    { message = "^test", group = "<!-- 4 -->Testes" },
    { message = "^docs", group = "<!-- 5 -->Documentação" },
    { message = "^ci|^build", group = "<!-- 6 -->Infraestrutura" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "<!-- 7 -->Manutenção" },
    { message = ".*", group = "<!-- 8 -->Outros" },
]

commit_preprocessors = [
    # Tira o sufixo "(0.1.2)" e "; release 0.3.1" que alguns assuntos antigos
    # carregam: a versão já é o título da seção.
    { pattern = '\s*[;,]?\s*\(?release\s+[0-9]+\.[0-9]+\.[0-9]+\)?\s*$', replace = "" },
    { pattern = '\s*\([0-9]+\.[0-9]+\.[0-9]+\)\s*$', replace = "" },
]
